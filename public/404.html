<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada | Dev English Gym</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&display=swap');
      body { display: grid; place-items: center; min-height: 100dvh; margin: 0; color: #181818; background: #f5f1e8; font: 500 1rem/1.5 Manrope, system-ui, sans-serif; }
      main { box-sizing: border-box; width: min(100% - 32px, 680px); padding: 32px; border: 1px solid #ad9950; border-radius: 16px; background: #f2da63; }
      img { display: block; border-radius: 8px; }
      h1 { margin: 16px 0 12px; font-size: 2.25rem; line-height: 2.5rem; font-weight: 600; text-wrap: balance; }
      p { margin: 0 0 24px; }
      a { display: inline-block; padding: 8px 12px; border: 1px solid #181818; border-radius: 8px; background: #181818; color: #fff; font-weight: 600; text-decoration: none; }
      a:hover { background: #f5f1e8; color: #181818; }
      a:focus-visible { outline: 2px solid #181818; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo192.png" width="48" height="48" alt="Dev English Gym" />
