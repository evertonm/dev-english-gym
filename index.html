    <meta name="theme-color" content="#081126" />
    <script>
      try {
        var savedTheme = localStorage.getItem('devenglish-theme')
        if (savedTheme === 'light' || (savedTheme === 'auto' && !matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#faf9f7'
        }
      } catch {}
    </script>

    <style>
      /* Themed background before the app loads, so a slow start is never a white flash. */
      html{color-scheme:dark;color:#eef4ff;background:#081126}
      html[data-theme=light]{color-scheme:light;color:#1b2a5a;background:#faf9f7}
      body{margin:0}
      .crash{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center;font:16px/1.5 Nunito,system-ui,sans-serif}

      .crash button{margin-top:10px;font:inherit;font-weight:800;padding:12px 22px;border:0;border-radius:14px;background:#6684e6;color:#fff;cursor:pointer}
    </style>

  <body>
    <div id="root"></div>

      <p>Pratique inglês para dailies, code reviews e entrevistas. Ative o JavaScript para experimentar as primeiras atividades.</p>
    </noscript>
    <script>
      // If the app script never starts (e.g. an old cached page after an update), offer a reload.
      setTimeout(function () {
        var r = document.getElementById('root')
        if (r && !r.firstChild) r.innerHTML = '<div class="crash"><p class="crash-t">Carregando demorou demais.</p><p>Toque para tentar de novo.</p><button onclick="location.reload()">Recarregar</button></div>'
      }, 10000)
    </script>
